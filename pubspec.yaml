name: bisma_typing_tutor
description: "BISMA: AI Cartoon Typing Tutor for Children"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.2
  shared_preferences: ^2.3.5
  http: ^1.3.0
  confetti: ^0.8.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.0.17
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/characters/
    - assets/images/
